name: 安装或运行问题
description: 报告安装、启动、暂停或恢复问题
title: "[问题] "
body:
  - type: input
    id: antigravity-version
    attributes:
      label: Antigravity 版本
      placeholder: "例如 2.24.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS 版本
      placeholder: "例如 macOS 15.x"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤和实际结果
      description: 请先删除路径、账号、聊天内容、日志中的敏感信息。
    validations:
      required: true
