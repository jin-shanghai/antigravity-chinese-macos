<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">让 Antigravity 说中文</title>
  <desc id="desc">Google Antigravity macOS Simplified Chinese UI helper</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="520" rx="36" fill="url(#bg)"/>
  <circle cx="1030" cy="80" r="130" fill="#7c3aed" opacity=".25" filter="url(#blur)"/>
  <circle cx="170" cy="470" r="150" fill="#0ea5e9" opacity=".18" filter="url(#blur)"/>
  <g fill="none" stroke="url(#glow)" stroke-linecap="round" opacity=".8">
    <ellipse cx="940" cy="260" rx="250" ry="82" stroke-width="4" transform="rotate(-24 940 260)"/>
    <ellipse cx="940" cy="260" rx="250" ry="82" stroke-width="2" transform="rotate(32 940 260)"/>
    <ellipse cx="940" cy="260" rx="250" ry="82" stroke-width="2" transform="rotate(88 940 260)"/>
  </g>
  <circle cx="940" cy="260" r="32" fill="#f8fafc" opacity=".95"/>
  <circle cx="940" cy="260" r="16" fill="#38bdf8"/>
  <g fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="78" y="178" font-size="62" font-weight="700">让 Antigravity 说中文</text>
    <text x="82" y="238" font-size="25" fill="#cbd5e1">Google Antigravity · macOS · 简体中文界面助手</text>
    <text x="82" y="322" font-size="23" fill="#bae6fd">不改官方 App</text>
    <text x="300" y="322" font-size="23" fill="#c4b5fd">可暂停</text>
    <text x="440" y="322" font-size="23" fill="#bae6fd">可恢复</text>
    <text x="580" y="322" font-size="23" fill="#c4b5fd">保护代码和真实工作内容</text>
    <text x="82" y="414" font-size="20" fill="#94a3b8">Community localization helper · Antigravity 2.24.0 · zh-CN</text>
  </g>
</svg>
